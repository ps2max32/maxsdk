# .github/workflows/ps2.yml of ps2max32/maxsdk.
# Builds the checkout (not the image's copy of maxsdk) with the image's LLVM
# and picolibc: the library, tests, probes, examples and ps2batch.elf, the
# host tests, and the check that nothing links ps2sdk. images.yml in
# ps2max32/docker only moves its maxsdk pin to commits where this passed.
name: ps2

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2max32/ps2max:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j$(nproc) OUT=$PWD/out all
      - name: Host tests
        run: make OUT=$PWD/out test-host
      - name: No ps2sdk
        run: make OUT=$PWD/out check-deps
      - uses: actions/upload-artifact@v4
        with:
          name: maxsdk-${{ github.sha }}
          path: |
            out/batch/ps2batch.elf
            out/tests/*.elf
            out/examples/*.elf
            out/mxload.elf
