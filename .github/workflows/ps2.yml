# .github/workflows/ps2.yml of ps2max32/maxsdk (template: ci/maxsdk.yml of ps2max32/docker).
# Builds with the commits its ps2max.deps names (LLVM, maxsdk, ...), through
# the reusable build of ps2max32/docker. Builds the checkout (libs/maxsdk is a link to it) with
# picolibc and lwIP from its ps2max.deps: the library, tests, probes, examples
# and ps2batch.elf, the host tests, and the check that nothing links ps2sdk.
name: ps2

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ps2:
    uses: ps2max32/docker/.github/workflows/build.yml@main
    with:
      self: MAXSDK
      build: |
        make -j$(nproc) OUT=$PWD/out all
        make OUT=$PWD/out test-host
        make OUT=$PWD/out check-deps
      artifacts: |
        out/batch/ps2batch.elf
        out/tests/*.elf
        out/examples/*.elf
      release: false
